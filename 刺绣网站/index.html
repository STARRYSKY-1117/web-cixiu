<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<link rel="stylesheet" href="css/zuoye.css" />
	</head>
	<body  >
		<div class="con">
			<div class="div1">
				账户:<input type="text" id="admin"  /><br />
				<div class="div2">密码:<input type="password"  id="mima"  /><span><img src="img/close.png" id="eye"></span><br /></div>
				<button class="a1">登录</button>
			</div>
		</div>
		
		<script>
			var eye=document.getElementById('eye');
			var mima=document.getElementById('mima');
			eye.onclick=function(){
				if(mima.type=='password')
				{
					mima.type='text';
					eye.src='img/open.png';
				}
				else{
					mima.type='password';
					eye.src='img/close.png';
				}
			};
			
			
			var denglu=document.querySelector('.a1');
			var adn =document.getElementById('admin');
			var pwd=document.getElementById('mima');
			denglu.onclick=function(){
				if(adn.value=="admin" && pwd.value=="123456")
				{
					window.location.href='zy.html';
				}
				else if(adn.value==''|| pwd.value=='')
				{
					alert('账号或密码不能为空!');
				}
				else{
					alert('账号或密码错误!');
				}
		};
		</script>
	</body>
</html>
